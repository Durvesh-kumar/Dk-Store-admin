name: "DK-Store-admin Continous Intregration"

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:

            - name: Update ubuntu
              run: sudo apt-get update

            - name: Setup bun
              run: |
                curl -fsSL https://bun.sh/install | bash
                echo "$HOME/.bun/bin" >> $GITHUB_PATH
            
            - name: Verify Bun installation
              run: bun --version

            - name: Checkout repository
              uses: actions/checkout@v5.0.0

            - name: Install dependecies
              run: bun install

            - name: Run lint
              run: bun lint

            - name: Upload production-ready build files
              uses: actions/upload-artifact@v4.6.2
              with:
                name: build           # <--- This must match the CD workflow
                path: |
                  .next
                  package.json
                  next.config.js
                  app
                  components
                  lib
                  components.json
                  public
                  node_modules